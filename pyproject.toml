[project]
name = "agentic-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alvaro Gomez", email = "alvarogomezgranda@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pyrefly>=1.3.1",
    "ruff>=0.16.8",
    "textual>=8.2.8",
]

[project.scripts]
agentic-hub = "agentic_hub.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pyrefly]
project-includes = ["src", "tests"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PL", "UP", "TID", "ASYNC", "DTZ", "FAST"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
